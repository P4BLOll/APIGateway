server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: api-pablo
          uri: http://localhost:8081
          predicates:
            - Path=/pablo/**
          filters:
            - StripPrefix=1
        - id: api-pedro
          uri: http://localhost:8082
          predicates:
            - Path=/pedro/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG